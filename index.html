<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hand Magic Box</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; }
  #video {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1); z-index: 0;
  }
  #three-canvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1; pointer-events: none;
  }
  #status {
    position: fixed; top: 12px; left: 12px; z-index: 5;
    color: #fff; font-family: Arial, sans-serif; font-size: 13px;
    background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 8px;
    max-width: 80%;
  }
  #startBtn {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: 10; padding: 16px 28px; font-size: 16px; border: none;
    border-radius: 10px; background: #00e28a; color: #04321f; cursor: pointer;
  }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="three-canvas"></canvas>
<div id="status">Loading camera & hand model…</div>
<button id="startBtn">Enable Camera</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const video = document.getElementById('video');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');

// ---------- three.js scene ----------
const canvas3d = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.z = 5;

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// wireframe box
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const boxEdges = new THREE.EdgesGeometry(boxGeo);
const boxMat = new THREE.LineBasicMaterial({ color: 0x8fffe0 });
const box = new THREE.LineSegments(boxEdges, boxMat);
box.visible = false;
scene.add(box);

// flower sprite texture (drawn on a canvas)
function makeFlowerTexture() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.font = '48px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🌸', 32, 34);
  return new THREE.CanvasTexture(c);
}
const flowerTex = makeFlowerTexture();

let flowers = [];
function spawnFlower(center, spread) {
  const mat = new THREE.SpriteMaterial({ map: flowerTex, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(0.28, 0.28, 0.28);
  sprite.position.set(
    center.x + (Math.random() - 0.5) * spread,
    center.y + (Math.random() - 0.5) * spread,
    center.z + (Math.random() - 0.5) * spread
  );
  sprite.userData = {
    vy: 0.003 + Math.random() * 0.004,
    phase: Math.random() * Math.PI * 2,
    life: 1
  };
  scene.add(sprite);
  flowers.push(sprite);
}

// convert normalized landmark (0..1, video mirrored) to world space near a fixed depth
function toWorld(nx, ny, z = 0) {
  const mirroredX = 1 - nx; // unmirror since video CSS is scaleX(-1)
  const vx = (mirroredX - 0.5) * 2;
  const vy = -(ny - 0.5) * 2;
  const vFOV = camera.fov * Math.PI / 180;
  const heightAtZ = 2 * Math.tan(vFOV / 2) * (camera.position.z - z);
  const widthAtZ = heightAtZ * camera.aspect;
  return new THREE.Vector3(vx * widthAtZ / 2, vy * heightAtZ / 2, z);
}

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y, (a.z||0) - (b.z||0));
}

// gesture: pointing = index extended, other three curled
function isPointing(lm) {
  const indexExt = dist(lm[8], lm[0]) > dist(lm[6], lm[0]) * 1.15;
  const middleCurl = dist(lm[12], lm[0]) < dist(lm[10], lm[0]) * 1.05;
  const ringCurl = dist(lm[16], lm[0]) < dist(lm[14], lm[0]) * 1.05;
  const pinkyCurl = dist(lm[20], lm[0]) < dist(lm[18], lm[0]) * 1.05;
  return indexExt && middleCurl && ringCurl && pinkyCurl;
}

// gesture: open palm = all fingertips far from wrist
function isOpenPalm(lm) {
  const tips = [8, 12, 16, 20];
  return tips.every(i => dist(lm[i], lm[0]) > dist(lm[i - 2], lm[0]) * 1.1);
}

let boxCenter = new THREE.Vector3(0, 0, 0);
let boxTargetScale = 0;
let spawnCooldown = 0;

function onResults(results) {
  const hands = results.multiHandLandmarks || [];
  let pointingHand = null;
  let palmHand = null;

  hands.forEach(lm => {
    if (isPointing(lm)) pointingHand = lm;
    else if (isOpenPalm(lm)) palmHand = lm;
  });

  if (pointingHand) {
    const tip = pointingHand[8];
    const target = toWorld(tip.x, tip.y, 0);
    boxCenter.lerp(target, 0.25);
    box.position.copy(boxCenter);
    box.visible = true;
    boxTargetScale = 1.6;
    statusEl.textContent = 'Box tracking your pointing finger ✋👉';
  } else {
    boxTargetScale = 0;
    statusEl.textContent = 'Point one finger to draw a box, open the other palm to fill it with flowers';
  }

  if (palmHand && box.visible) {
    spawnCooldown -= 1;
    if (spawnCooldown <= 0) {
      spawnFlower(boxCenter, 0.9);
      spawnCooldown = 4;
    }
  }
}

let lastScale = 0.001;
function animate() {
  requestAnimationFrame(animate);
  lastScale += (boxTargetScale - lastScale) * 0.15;
  box.scale.set(Math.max(lastScale, 0.001), Math.max(lastScale, 0.001), Math.max(lastScale, 0.001));
  box.rotation.y += 0.01;

  flowers.forEach(f => {
    f.position.y += f.userData.vy;
    f.userData.phase += 0.05;
    f.position.x += Math.sin(f.userData.phase) * 0.002;
    f.userData.life -= 0.003;
    f.material.opacity = Math.max(f.userData.life, 0);
  });
  flowers = flowers.filter(f => {
    if (f.userData.life <= 0) { scene.remove(f); return false; }
    return true;
  });

  renderer.render(scene, camera);
}
animate();

// ---------- MediaPipe Hands setup ----------
let handsModel, cameraUtil;

function startTracking() {
  startBtn.style.display = 'none';
  statusEl.textContent = 'Requesting camera permission…';

  handsModel = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });
  handsModel.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.6
  });
  handsModel.onResults(onResults);

  cameraUtil = new Camera(video, {
    onFrame: async () => { await handsModel.send({ image: video }); },
    width: 640,
    height: 480
  });
  cameraUtil.start()
    .then(() => { statusEl.textContent = 'Point one finger to draw a box, open the other palm to fill it with flowers'; })
    .catch(err => { statusEl.textContent = 'Camera error: ' + err.message + ' — try opening this file directly in your browser (not inside an embedded preview).'; });
}

startBtn.addEventListener('click', startTracking);
</script>
</body>
</html>
